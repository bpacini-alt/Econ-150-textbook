<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 16 Precise Practice · Pilot</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#21313e;font:15px/1.5 system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;border-radius:9px;padding:11px;border:1px solid #bed0d9;background:#fff;color:#21313e}button:focus-visible,textarea:focus-visible{outline:3px solid #19759b}button:hover{border-color:#19759b}.primary{background:#145c78;border-color:#145c78;color:white;font-weight:700}.primary:disabled{opacity:.5;cursor:default}.shell{max-width:1080px;margin:auto;padding:24px 16px}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}.panel{background:white;border:1px solid #dce7eb;border-radius:14px;padding:22px}.side{position:sticky;top:16px}.nav{width:100%;text-align:left;margin:4px 0}.active{background:#e8f5f9;border:2px solid #27718b}.muted{color:#5f7581}.tiny{font-size:12px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#557485}h1{margin:3px 0;font-size:32px}h2{font-size:25px;margin:5px 0 15px}.modes,.actions,.choicewrap{display:flex;gap:8px;flex-wrap:wrap}.modes button{flex:1;min-width:145px}.card{padding:18px;border-radius:11px;background:#f0f5f7;margin:15px 0}.prompt{font-size:18px;font-weight:650}.choicewrap{flex-direction:column}.choice{text-align:left;width:100%}.chosen{border:2px solid #247697;background:#e9f6fa}.feedback{background:#edf6ee;border-left:4px solid #438a58;padding:14px;margin:14px 0}.feedback.bad{background:#fff6e8;border-color:#b78941}.bar{height:125px;width:12px;background:#e7eff1;border-radius:20px;display:flex;align-items:end;overflow:hidden;flex-shrink:0}.fill{width:100%;background:#298364;border-radius:20px}.progress{display:flex;gap:14px;align-items:center;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.flip{text-align:left;min-height:85px;background:#eef4f7}.editor{width:100%;min-height:125px;padding:12px;border-radius:9px;border:1px solid #aebfc8;resize:vertical}.section{border-top:1px solid #d7e3e8;padding-top:20px;margin-top:20px}.notice{padding:14px;background:#ecf4f8;border-radius:9px}@media(max-width:760px){.layout{display:block}.side{position:static;margin-bottom:15px}.navlist{display:grid;grid-template-columns:repeat(2,1fr)}.panel{padding:15px}.cards{grid-template-columns:1fr}}</style></head><body><header style="background:white;border-bottom:1px solid #dce7eb"><div class="shell"><div class="eyebrow">Econ 150 · Chapter 16 · Review-only prototype</div><h1>Institutions: Precise Practice</h1><p class="muted">Six concept checkpoints. Three tiers. One cumulative challenge. Choose your own route.</p></div></header><main class="shell layout"><aside class="panel side"><div class="eyebrow">Choose a checkpoint</div><div class="navlist" id="nav"></div><div class="notice"><b>Already getting it?</b><p class="tiny">Try the chapter challenge immediately. Practice is always available.</p><button id="jump">Chapter challenge</button></div><p><button id="reset">Reset pilot progress</button></p></aside><section class="panel" id="work" aria-live="polite"></section></main><script>

that markets require no rules. Explain which rules help and which can obstruct competition.","Propose two institutional reforms to help a market whose contracts are routinely broken."]},{"name":"Property Rights","cats":["Use","Exclude","Transfer","Enforce"],"foundation":[{"q":"Plant vegetables on owned land","a":0},{"q":"Keep trespassers off private land","a":1},{"q":"Sell a farm to a neighbor","a":2},{"q":"Seek compensation for property damage","a":3},{"q":"Convert a workshop to a shop","a":0},{"q":"Stop an unauthorized use of one's reserved seat","a":1},{"q":"Give a bicycle to a child","a":2},{"q":"Take a trespass claim to court","a":3},{"q":"Lease a room to a tenant","a":0},{"q":"License a book publisher","a":2}],"why":"Rights are a bundle of powers, not merely physical possession.","cards":[["Use","Control ordinary uses of a resource"],["Exclude","Keep unauthorized users out"],["Transfer","Sell lease or give a claim"],["Enforce","Obtain a remedy for a violated claim"]],"applied":[{"q":"Two neighbors dispute where a fence belongs. Best first step?","opts":["Identify and document the boundary","Raise the fence immediately","Ignore ownership"],"a":0,"why":"Clear entitlements can support bargaining."},{"q":"A lease contract is valid but cannot be enforced. Which right is undermined?","opts":["Use","Enforcement","Transfer"],"a":1,"why":"Rights need practical remedies."},{"q":"Nine owners agree to grant access but the tenth holds out. This suggests…","opts":["No scarcity","Non-rival consumption","A bargaining or holdout problem"],"a":2,"why":"Multiple rights holders complicate negotiation."},{"q":"A farmer has a title but cannot transfer it. Which part of ownership is restricted?","opts":["Transfer","Use","Exclusion"],"a":0,"why":"Ownership bundles can differ."},{"q":"Compensation is offered for a taking. Does it settle every issue?","opts":["Yes automatically","No"],"a":null},{"q":" procedure and valuation still matter","opts":["Only if cash is used","1","Legal claims involve more than payment."],"a":null}],"advanced":["Design a clear set of shared-driveway rights for neighbors, including enforcement.","Explain how secure ownership promotes investment and why rights still have limits."]},{"name":"Corruption","cats":["Inclusive","Extractive","Insufficient evidence"],"foundation":[{"q":"Courts treat newcomers and insiders equally","a":0},{"q":"Exclusive contracts go only to donors","a":1},{"q":"A country reports high GDP but no institutional data","a":2},{"q":"Published permits with independent appeals","a":0},{"q":"Inspectors demand secret payments","a":1},{"q":"A new port is announced without access rules","a":2},{"q":"New firms may compete under identical rules","a":0},{"q":"Only relatives can win tenders","a":1},{"q":"A tax cut is promised without implementation details","a":2},{"q":"Regulators exempt their friends","a":1}],"why":"Inclusive institutions spread opportunities; extractive institutions reserve advantages for insiders. Some evidence is inconclusive.","cards":[["Inclusive","Broad and impartial opportunity"],["Extractive","Insiders capture privilege"],["Rent seeking","Gaining advantages through rules rather than value creation"],["Correlation","Association that does not prove cause"]],"applied":[{"q":"Bribes appear to speed one permit. Which objection is strongest?","opts":["They can encourage slower and arbitrary systems","They end all waiting","They prove permits are useless"],"a":0,"why":"Individual shortcuts can create institutional costs."},{"q":"Rich nations tend to show less corruption. What follows?","opts":["Proof of a single cause","Association but not proof of causation","Nothing whatsoever"],"a":1,"why":"Confounding and reverse causation are possible."},{"q":"A donor receives a monopoly license. What happens?","opts":["Competition increases","Prices become irrelevant","Entry may be distorted"],"a":2,"why":"Privilege can protect insiders."},{"q":"Transparent procurement and appeals may improve…","opts":["Accountability","Resource abundance","Rivalry"],"a":0,"why":"Transparency can constrain favoritism."},{"q":"A politician promises to end corruption without enforcement. What matters?","opts":["Slogans alone","Credible monitoring and incentives","Only tax rates"],"a":1,"why":"Effective institutions require incentives and enforcement."}],"advanced":["Evaluate the claim that small bribes always grease the wheels of commerce.","Propose institutional reforms after a licensing office privileges political insiders."]},{"name":"Transaction Costs","cats":["Search","Negotiation","Verification","Enforcement"],"foundation":[{"q":"Compare dozens of apartment listings","a":0},{"q":"Bargain over a delivery contract","a":1},{"q":"Check a seller's identity","a":2},{"q":"Sue to recover an unpaid debt","a":3},{"q":"Look up suppliers with inventory","a":0},{"q":"Discuss a shared fence agreement","a":1},{"q":"Audit a borrower's claims","a":2},{"q":"Seek a legal remedy for breach","a":3},{"q":"Find a reputable used car","a":0},{"q":"Revise the terms of a lease","a":1}],"why":"Exchange has search, bargaining, verification and enforcement costs beyond the purchase price.","cards":[["Search","Finding possible partners and offers"],["Negotiation","Agreeing on terms"],["Verification","Checking claims and quality"],["Enforcement","Securing compliance and remedies"]],"applied":[{"q":"Verified seller reviews may lower which cost?","opts":["Shipping costs","Verification costs","Scarcity"],"a":1,"why":"Reliable reviews reduce uncertainty."},{"q":"Citywide smog affects thousands. Bargaining is hard because…","opts":["Affected parties are numerous","All pollution is non-rival","No one can measure costs"],"a":0,"why":"Coordination becomes expensive."},{"q":"A standard contract cuts repeated legal drafting. It lowers…","opts":["Rivalry","Physical costs","Negotiation costs"],"a":2,"why":"Agreed templates reduce time spent bargaining."},{"q":"Land records let buyers check titles. They reduce…","opts":["Verification costs","Weather risk","Population growth"],"a":0,"why":"Information about ownership is easier to verify."},{"q":"When can private bargains fail to resolve harms?","opts":["Never","When transaction costs overwhelm potential gains","Only under perfect competition"],"a":1,"why":"Rights, numbers and costs determine feasibility."}],"advanced":["Compare bargaining over one factory and one fishery with citywide smog.","Explain how a beneficial project can fail because negotiating costs exceed expected gains."]},{"name":"Public Goods & Common Resources","cats":["Private","Club","Common resource","Public"],"foundation":[{"q":"Sandwich bought at a café","a":0},{"q":"Uncongested subscription stream","a":1},{"q":"Open-access lake fish","a":2},{"q":"National defense","a":3},{"q":"Reserved airplane seat","a":0},{"q":"Uncongested toll road","a":1},{"q":"Open-access groundwater","a":2},{"q":"Town-wide siren warning","a":3},{"q":"Apple at a grocery","a":0},{"q":"Password-protected digital course with spare capacity","a":1},{"q":"Unrestricted ocean fishery","a":2},{"q":"Clean air over a city","a":3}],"why":"Rivalry and excludability determine classification, not whether government pays.","cards":[["Rival","One user's consumption reduces availability"],["Excludable","Users can feasibly be denied access"],["Common resource","Rival but difficult to exclude"],["Public good","Non-rival and non-excludable"]],"applied":[{"q":"A toll road becomes congested. What changes?","opts":["Excludability disappears","Rivalry increases","It becomes pure public"],"a":1,"why":"Congestion makes road use rival."},{"q":"A fishery gains enforceable permits. Fish then become…","opts":["Non-rival","Automatically abundant","More excludable but still rival"],"a":2,"why":"Access control does not change depletion."},{"q":"Why might streetlights be underfunded privately?","opts":["Free riding","Their light is rival","They have zero cost"],"a":0,"why":"Nonexcludable benefits invite free riding."},{"q":"A streaming service is congested. Which is most accurate?","opts":["It is never rival","Rivalry depends on capacity","It is no longer excludable"],"a":1,"why":"Congestion changes marginal crowding."},{"q":"Publicly provided bottles of water are…","opts":["Necessarily public goods","Never scarce","Still rival and potentially excludable"],"a":2,"why":"Funding does not define the category."}],"advanced":["Compare catch limits and entrance fees for an overfished shared lake.","Explain why socially valuable goods are not necessarily public goods."]},{"name":"The Rights You Do Not Have","cats":["Genuine harm","Mere objection","Needs evidence"],"foundation":[{"q":"A project floods a neighbor's basement","a":0},{"q":"A resident dislikes a lawful house color","a":1},{"q":"A factory's alleged damage has no supporting data","a":2},{"q":"Construction blocks a legal easement","a":0},{"q":"A competitor dislikes a new business","a":1},{"q":"Neighbors fear parking problems without any study","a":2},{"q":"A nightclub violates legal noise limits","a":0},{"q":"A resident dislikes unfamiliar new families","a":1},{"q":"A developer asserts there can be no runoff without studying it","a":2},{"q":"An excavation damages another owner's fence","a":0}],"why":"A legally relevant injury differs from discomfort or dislike; uncertainty often calls for evidence.","cards":[["External harm","Effect imposed on others"],["Entitlement","A legally protected claim"],["Veto","Power to block an activity"],["Evidence","Facts to test whether a harm exists"]],"applied":[{"q":"A café reduces another café's customers. Does that automatically create a veto?","opts":["Yes","No","Only at high prices"],"a":1,"why":"Competition itself is not a right to exclude."},{"q":"A builder blocks a recorded easement. Best response?","opts":["Investigate the right and remedy","Dismiss the complaint","Assume the builder owns all rights"],"a":0,"why":"An easement is a real claim."},{"q":"Neighbors allege a project will flood homes. Next step?","opts":["Reject automatically","Approve automatically","Seek drainage evidence"],"a":2,"why":"Evidence distinguishes harm from fear."},{"q":"Residents dislike seeing a taller building. A broad veto may…","opts":["Restrict housing supply without a protected claim","Always increase housing","Eliminate transaction costs"],"a":0,"why":"Preferences are not automatically legal rights."},{"q":"A project creates jobs but damages a fence. What follows?","opts":["Job gains erase the injury","The damage can still warrant remedy","The fence becomes public"],"a":1,"why":"Benefits do not extinguish others' rights."}],"advanced":["Distinguish legitimate harm claims from preferences during a housing proposal.","Evaluate the claim that falling neighboring home values always justify a veto."]}];

["Institutional foundations","Identify the rules necessary for a private operator to manage a public lake and carry out contracts."],
["Property rights","Clarify who can fish, exclude users, change the shoreline, and claim compensation."],

["Transaction costs","Assess negotiation among residents, fishers, two towns, and the operator."],

const K="ch16-pp-review-v1";let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.hist)S={c:0,t:0,n:0,hist:{},drafts:{},reveals:{}};
let choice=null,checked=false,flash=false,flips={};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const key=(c,t)=>c+"_"+t;
const hist=(c,t)=>S.hist[key(c,t)]||(S.hist[key(c,t)]={seen:[],right:[]});
function status(c){const a=hist(c,0),b=hist(c,1);return a.right.length>=7&&b.right.length>=3?"Understanding demonstrated":a.seen.length||b.seen.length?"Practice recommended":"Not yet assessed"}
function go(c,t=0){S.c=c;S.t=t;S.n=0;choice=null;checked=false;flash=false;save();render()}
function nav(){document.querySelector("#nav").innerHTML=D.map((c,i)=>'<button class="nav '+(i===S.c?'active':'')+'" data-c="'+i+'"><b>'+(i+1)+'. '+esc(c.name)+'</b><div class="tiny muted">'+esc(status(i))+'</div></button>').join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>go(+b.dataset.c))}
function show(){
const c=D[S.c],t=S.t,arr=t===0?c.foundation:t===1?c.applied:c.advanced,n=S.n%arr.length,p=hist(S.c,t);
let html='<div class="eyebrow">Concept '+(S.c+1)+' of 6</div><h2>'+esc(c.name)+'</h2><div class="modes">'+["1 · Foundations","2 · Application","3 · Reasoning"].map((m,i)=>'<button class="'+(i===t?'active':'')+'" data-tier="'+i+'">'+m+'</button>').join("")+'</div>';
html+='<div class="progress"><div class="bar"><div class="fill" style="height:'+Math.round(100*p.seen.length/arr.length)+'%"></div></div><div><b>'+p.seen.length+' of '+arr.length+' prompts tried</b><div class="muted tiny">'+p.right.length+' distinct correct · '+esc(status(S.c))+'</div><div class="muted tiny">Practice is optional; jump to any tier at any time.</div></div></div>';
if(t<2){const item=arr[n];html+='<div class="card"><div class="eyebrow">'+(t===0?'Rapid foundations':'Applied decision')+' · '+(n+1)+'/'+arr.length+'</div><div class="prompt">'+esc(item.q)+'</div></div><div class="choicewrap">'+(t===0?c.cats:item.opts).map((q,i)=>'<button class="choice '+(choice===i?'chosen':'')+'" data-choice="'+i+'">'+esc(q)+'</button>').join("")+'</div>';
if(checked){const ok=choice===item.a;html+='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'Correct.':'Review the distinction.')+'</b><p>'+esc(t===0?c.why:item.why)+'</p><div class="tiny">Best answer: '+esc(t===0?c.cats[item.a]:item.opts[item.a])+'</div></div>'}
html+='<div class="actions"><button class="primary" id="check" '+(choice===null&&!checked?'disabled':'')+'>'+(checked?'Next prompt':'Check answer')+'</button><button id="skip">Different example</button>'+(t===0?'<button id="flash">Key ideas / flashcards</button>':'')+'</div>';
if(t===0&&flash)html+='<div class="cards" style="margin-top:15px">'+c.cards.map((x,i)=>'<button class="flip" data-flip="'+i+'"><b>'+esc(x[0])+'</b><div class="muted tiny">'+(flips[i]?esc(x[1]):'Tap to reveal definition')+'</div></button>').join("")+'</div>';
}else{const k="essay_"+S.c+"_"+n;html+='<div class="card"><div class="eyebrow">Independent explanation · '+(n+1)+'/'+arr.length+'</div><div class="prompt">'+esc(arr[n])+'</div></div><textarea class="editor" id="essay" placeholder="Explain in your own words…">'+esc(S.drafts[k]||"")+'</textarea><div class="notice tiny">Open responses are for self-review; this pilot does not automatically score FRQs or award gold status.</div>';
if(S.reveals[k])html+='<div class="feedback"><b>Self-check</b><p>Have you identified the relevant economic concept, explained the causal mechanism, and acknowledged an important assumption or limitation?</p></div>';
html+='<div class="actions"><button class="primary" id="rubric">Show / hide self-check</button><button id="skip">Next reasoning prompt</button></div>'}
html+='<div class="section"><button id="challenge">Go to chapter challenge now</button></div>';
document.querySelector("#work").innerHTML=html;
document.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>go(S.c,+b.dataset.tier));
document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(checked)return;choice=+b.dataset.choice;show()});
const advance=()=>{S.n++;choice=null;checked=false;save();show()};
document.querySelector("#skip").onclick=advance;
if(t<2){document.querySelector("#check").onclick=()=>{if(checked){advance();return}if(choice===null)return;const h=hist(S.c,t);if(!h.seen.includes(n))h.seen.push(n);if(choice===arr[n].a&&!h.right.includes(n))h.right.push(n);checked=true;save();show()};if(t===0){document.querySelector("#flash").onclick=()=>{flash=!flash;show()};document.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{flips[b.dataset.flip]=!flips[b.dataset.flip];show()})}}
else{const k="essay_"+S.c+"_"+n;document.querySelector("#essay").oninput=e=>{S.drafts[k]=e.target.value;save()};document.querySelector("#rubric").onclick=()=>{S.reveals[k]=!S.reveals[k];const h=hist(S.c,t);if(!h.seen.includes(n))h.seen.push(n);save();show()}}
document.querySelector("#challenge").onclick=()=>go(6);
}
function chapter(){let html='<div class="eyebrow">Optional chapter test-out / synthesis</div><h2>The Lake and the Rules</h2><p>A town proposes private management of a shared lake. The operator wants fishing permits, entrance fees, and a new car park. A relative of the mayor seeks the exclusive contract. Residents disagree about access and runoff.</p><div class="notice"><b>Start here whenever you are ready.</b><p class="tiny">Six connected FRQ-style prompts. This is a self-review pilot, not an automatically graded test-out. You can return to any checkpoint for targeted practice.</p></div>';
parts.forEach((p,i)=>{const k="chapter_"+i;html+='<div class="section"><div class="eyebrow">Part '+(i+1)+' · '+esc(D[i].name)+'</div><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p><textarea class="editor" data-part="'+i+'" placeholder="Explain your thinking…">'+esc(S.drafts[k]||"")+'</textarea><div class="actions"><button data-review="'+i+'">Show / hide self-check</button><button data-jump="'+i+'">Practice this concept</button></div>'+(S.reveals[k]?'<div class="feedback">Check your answer for a clearly stated concept, an accurate mechanism, a reasoned recommendation, and relevant uncertainty. Discuss with your instructor for reliable scoring.</div>':'')+'</div>'});
document.querySelector("#work").innerHTML=html;document.querySelectorAll("[data-part]").forEach(e=>e.oninput=()=>{S.drafts["chapter_"+e.dataset.part]=e.value;save()});document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>{const k="chapter_"+b.dataset.review;S.reveals[k]=!S.reveals[k];save();chapter()});document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>go(+b.dataset.jump));
}
function render(){nav();S.c===6?chapter():show()}
document.querySelector("#jump").onclick=()=>go(6);document.querySelector("#reset").onclick=()=>{if(confirm("Clear locally saved pilot progress?")){localStorage.removeItem(K);S={c:0,t:0,n:0,hist:{},drafts:{},reveals:{}};choice=null;checked=false;render()}};render();
</script></body></html>
