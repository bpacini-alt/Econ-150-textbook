 if(e.type==="matrix")correct=Array.from({length:4},(_,i)=>c.foundation[(e.index*4+i)%c.foundation.length]).every((v,i)=>e.picks[i]===v.a);
 if(e.type==="predict")correct=EXTRA[S.c].predict[e.index%EXTRA[S.c].predict.length][2]===e.picks[0];
 if(e.type==="detect")correct=EXTRA[S.c].detectRounds[e.index%EXTRA[S.c].detectRounds.length].every((v,i)=>e.picks[i]===v[1]);
 if(e.type==="missing"||e.type==="repair"){const list=e.type==="missing"?EXTRA[S.c].missing:EXTRA[S.c].error;correct=e.picks[0]===list[e.index%list.length][2]}

};
}


function formats(t){return t===0?[["mix","Mix it up"],["quick","Quick classification"],["sort","Rapid Sort"],["detect","Definition Detective"],["missing","Missing Piece"],["flash","Flip cards · Pilot"],["memory","Memory Match · Pilot"]].concat(S.c===3?[["matrix","Four-goods matrix"]]:[]):t===1?[["mix","Mix it up"],["quick","Applied cases"],["repair","Fix the Error"],["predict","Change & Predict"]]:[["quick","AP-style multiple choice"]]}
