function examPool(){const bank=window.PRECISE_BANK_CH16.exam;const initial=[0,1,8,2,3,9,4,5,10,6,7,11];const additions=bank.slice(12);return initial.map(i=>bank[i]).concat(additions);}

 else{html+='<textarea class="editor" id="exam-writing" placeholder="Explain your reasoning in your own words…">'+esc(E.answers[key]||"")+'</textarea><div class="actions"><button id="exam-rubric">Show / hide scoring criteria</button></div>';if(E.reveals[key])html+='<div class="feedback"><b>Self-review criteria</b><ul>'+q.rubric.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><p>'+esc(q.feedback)+'</p><p class="tiny muted">Written answers are not graded automatically.</p></div>';}
