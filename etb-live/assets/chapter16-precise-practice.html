const parts=[

["Ownership and enforceability","A cold-storage cooperative needs access to land owned by several families. Clarify relevant use, transfer, and enforcement rights, and explain how uncertainty affects investment."],
["Insiders, corruption and deal costs","An official demands unofficial payments to approve trucks crossing a public bridge. Explain the private temptation to pay and the broader costs of institutionalized bribery, including transaction costs."],

function nav(){document.querySelector("#nav").innerHTML=D.map((c,i)=>'<button class="nav '+(i===S.c?'active':'')+'" data-c="'+i+'"><b>'+(i+1)+'. '+esc(c.name)+'</b><div class="tiny muted">'+esc(status(i))+'</div></button>').join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>go(+b.dataset.c))}

const EXTRA=window.PRECISE_BANK_CH16.extra;
if(!S.extra)S.extra={};
function extKey(){return S.c+"-"+S.t}
function extState(){const k=extKey();return S.extra[k]||(S.extra[k]={type:"sort",index:0,picks:[],submitted:false,attempts:{}})}

function extRender(c,t){
if(t>1)return "";
const e=extState();
const kinds=t===0?[["sort","Rapid Sort"],["detect","Definition Detective"],["missing","Find the Missing Piece"]]:[["repair","Find & Fix the Error"]];
if(!kinds.some(x=>x[0]===e.type)){e.type=kinds[0][0];e.index=0;e.picks=[];e.submitted=false}

if(e.type==="sort"){
 const list=c.foundation.slice(0,6),p=e.picks;

 h+='<div class="sortboard">'+list.map((it,i)=>'<div class="sortrow"><div>'+esc(it.q)+'</div><select data-sort="'+i+'" '+(e.submitted?'disabled':'')+'><option value="">Choose a category…</option>'+c.cats.map((cat,j)=>'<option value="'+j+'" '+(String(p[i])===String(j)?'selected':'')+'>'+esc(cat)+'</option>').join("")+'</select>'+(e.submitted?'<div class="tiny '+(p[i]===it.a?'good':'needs')+'">'+(p[i]===it.a?'Correct':'Best: '+esc(c.cats[it.a]))+'</div>':'')+'</div>').join("")+'</div>';
 h+='<p class="muted tiny">'+(e.submitted?list.filter((it,i)=>it.a===p[i]).length+' of 6 correctly categorized. '+esc(c.why):'Pick a category for each scenario before checking.')+'</p>';
 h+='<div class="actions"><button class="primary" id="extCheck" '+(!e.submitted&&p.filter(v=>v!==null&&v!==undefined).length<6?'disabled':'')+'>'+(e.submitted?'Try another round':'Check all six')+'</button></div>';
}else if(e.type==="detect"){
const list=data.detect;

h+='<div class="sortboard">'+list.map((it,i)=>'<div class="sortrow"><div>'+esc(it[0])+'</div><select data-sort="'+i+'" '+(e.submitted?'disabled':'')+'><option value="">Choose A, A−, or F…</option>'+["A","A−","F"].map(x=>'<option '+(e.picks[i]===x?'selected':'')+' value="'+x+'">'+x+'</option>').join("")+'</select>'+(e.submitted?'<p class="tiny '+(e.picks[i]===it[1]?'good':'needs')+'"><b>'+it[1]+'</b>: '+esc(it[2])+'</p>':'')+'</div>').join("")+'</div>';

const list=e.type==="missing"?data.missing:data.error,item=list[n%list.length];

h+='<div class="choicewrap">'+item[1].map((v,i)=>'<button data-extpick="'+i+'" '+(e.submitted?'disabled':'')+' class="choice '+(e.picks[0]===i?'chosen':'')+'">'+esc(v)+'</button>').join("")+'</div>';

h+='<div class="actions"><button class="primary" id="extCheck" '+(!e.submitted&&e.picks[0]===undefined?'disabled':'')+'>'+(e.submitted?'Another problem':'Check repair')+'</button></div>';
}
h+='</div>';

}
function extWire(c,t){

const e=extState();
document.querySelectorAll("[data-extra]").forEach(b=>b.onclick=()=>extSetType(b.dataset.extra));
document.querySelectorAll("[data-sort]").forEach(el=>el.onchange=()=>{
 const v=el.value;e.picks[+el.dataset.sort]=v===""?undefined:e.type==="detect"?v:Number(v);save();show()
});
document.querySelectorAll("[data-extpick]").forEach(b=>b.onclick=()=>{e.picks=[+b.dataset.extpick];save();show()});
const check=document.querySelector("#extCheck");if(check)check.onclick=()=>{
 if(e.submitted){e.index++;nextTurn();return}
 let correct=false;
 if(e.type==="sort")correct=c.foundation.slice(0,6).every((v,i)=>e.picks[i]===v.a);
 if(e.type==="detect")correct=EXTRA[S.c].detect.every((v,i)=>e.picks[i]===v[1]);
 if(e.type==="missing"||e.type==="repair"){const list=e.type==="missing"?EXTRA[S.c].missing:EXTRA[S.c].error;correct=e.picks[0]===list[e.index%list.length][2]}
 e.attempts[e.type+":"+(e.type==="sort"?e.index:e.type==="detect"?e.index:e.index%2)]={correct,when:new Date().toISOString()};e.submitted=true;save();show()
};
}


function formats(t){return t===0?[["mix","Mix it up"],["quick","Quick classification"],["sort","Rapid Sort"],["detect","Definition Detective"],["missing","Missing Piece"],["flash","Flip cards"]]:t===1?[["mix","Mix it up"],["quick","Applied cases"],["repair","Fix the Error"]]:[["reason","Independent reasoning"]]}
function fk(){return S.c+"_"+S.t}
function choiceFormat(){S.formats=S.formats||{};return S.formats[fk()]||"mix"}
function effectiveFormat(){const f=choiceFormat();if(f!=="mix")return f;const sequence=S.t===0?["quick","sort","quick","detect","missing","quick","flash"]:S.t===1?["quick","repair","quick","repair"]:["reason"];S.turns=S.turns||{};return sequence[(S.turns[fk()]||0)%sequence.length]}
function setFormat(f){S.formats=S.formats||{};S.formats[fk()]=f;choice=null;checked=false;flash=false;const e=extState();e.submitted=false;e.picks=[];save();show()}
function nextTurn(){S.n++;S.turns=S.turns||{};S.turns[fk()]=(S.turns[fk()]||0)+1;choice=null;checked=false;const e=extState();e.submitted=false;e.picks=[];save();show()}
function instructions(fmt){return ({quick:S.t===0?"Choose the best category for this situation, then check your answer.":"Choose the best economic explanation, then check your reasoning.",sort:"Sort all six situations into their best categories. Check the board when you finish.",detect:"Classify each explanation: A is complete, A− is incomplete, F is fundamentally wrong.",missing:"Choose the essential missing idea, then check the completed thought.",repair:"Find the mistake and choose the correction that fixes the economic reasoning.",flash:"Recall the meaning of the term before revealing its definition.",reason:"Explain the economic mechanism in your own words. Then use the self-check criteria."})[fmt]||""}

function show(){
 const c=D[S.c],t=S.t,arr=t===0?c.foundation:t===1?c.applied:c.advanced,n=S.n%arr.length,p=hist(S.c,t),fmt=effectiveFormat(),ex=extState();
 if(["sort","detect","missing","repair"].includes(fmt)&&ex.type!==fmt){ex.type=fmt;ex.submitted=false;ex.picks=[]}

 html+='<div class="practice-controls"><label for="pp-format">Practice style</label><select id="pp-format">'+options.map(o=>'<option value="'+o[0]+'" '+(choiceFormat()===o[0]?'selected':'')+'>'+esc(o[1])+'</option>').join("")+'</select></div>';

 html+='<div class="pp-progress-row"><div class="pp-bar"><span style="height:'+Math.min(100,total/10*100)+'%"></span></div><div class="tiny muted">'+total+' distinct practice prompts or boards attempted in this tier. More are available. <b>This is not a mastery score.</b></div></div>';
 if(fmt==="quick"){
 const item=arr[n];html+='<div class="card"><div class="eyebrow">'+(t===0?'Classify':'Apply')+' · '+(n+1)+'/'+arr.length+'</div><div class="prompt">'+esc(item.q)+'</div></div><div class="choicewrap">'+(t===0?c.cats:item.opts).map((q,i)=>'<button class="choice '+(choice===i?'chosen':'')+'" data-choice="'+i+'">'+esc(q)+'</button>').join("")+'</div>';
 if(checked){const ok=choice===item.a;html+='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'Correct.':'Review the distinction.')+'</b><p>'+esc(t===0?c.why:item.why)+'</p><div class="tiny">Best answer: '+esc(t===0?c.cats[item.a]:item.opts[item.a])+'</div></div>'}
 html+='<div class="actions"><button class="primary" id="check" '+(choice===null&&!checked?'disabled':'')+'>'+(checked?'Next problem':'Check answer')+'</button><button id="skip">Try another</button></div>';
 }else if(fmt==="flash"){
 const item=c.cards[S.n%c.cards.length];html+='<button id="flipcard" class="pp-compact-flash"><b>'+esc(item[0])+'</b><div class="muted">'+(flash?esc(item[1]):'Think of the meaning, then tap to reveal')+'</div></button><div class="actions"><button class="primary" id="skip">Next term</button></div>';
 }else if(fmt==="reason"){
 const k="essay_"+S.c+"_"+n;html+='<div class="card"><div class="eyebrow">Independent explanation · '+(n+1)+'/'+arr.length+'</div><div class="prompt">'+esc(arr[n])+'</div></div><textarea class="editor" id="essay" placeholder="Explain in your own words…">'+esc(S.drafts[k]||"")+'</textarea>';
 if(S.reveals[k])html+='<div class="feedback"><b>Self-check</b><p>Did you identify the relevant economic concepts, explain the mechanism, and qualify your conclusion appropriately?</p></div>';
 html+='<div class="actions"><button class="primary" id="rubric">Show / hide self-check</button><button id="skip">Next prompt</button></div><p class="tiny muted">Written responses are for self-review; this does not automatically grade FRQs.</p>';
 }else{
 html+=extRender(c,t);
 }
 html+='<div class="section"><button id="challenge">Jump to chapter exam practice</button></div>';
 document.querySelector("#work").innerHTML=html;
 document.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>go(S.c,+b.dataset.tier));
 document.querySelector("#pp-format").onchange=e=>setFormat(e.target.value);
 document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(checked)return;choice=+b.dataset.choice;show()});
 const skip=document.querySelector("#skip");if(skip)skip.onclick=()=>{flash=false;nextTurn()};
 const check=document.querySelector("#check");if(check)check.onclick=()=>{if(checked){nextTurn();return}if(choice===null)return;const h=hist(S.c,t);if(!h.seen.includes(n))h.seen.push(n);if(choice===arr[n].a&&!h.right.includes(n))h.right.push(n);checked=true;save();show()};

 const essay=document.querySelector("#essay");if(essay){const k="essay_"+S.c+"_"+n;essay.oninput=e=>{S.drafts[k]=e.target.value;save()};document.querySelector("#rubric").onclick=()=>{S.reveals[k]=!S.reveals[k];const h=hist(S.c,t);if(!h.seen.includes(n))h.seen.push(n);save();show()}}
 if(["sort","detect","missing","repair"].includes(fmt))extWire(c,t);
 document.querySelector("#challenge").onclick=()=>go(4);

 const E=examState(),pool=examPool(),count=Math.min(E.count,pool.length),items=pool.slice(0,count),n=Math.max(0,Math.min(E.index,count-1)),q=items[n],key=q.id,answered=E.answers[key];
 const mc=q.type==="mc", correct=mc&&answered===q.answer;
 let html='<div class="eyebrow">Chapter 16 · Exam-level practice</div><h2>Put it all together</h2><p class="muted">Mixed, unfamiliar questions that ask you to apply the ideas of this chapter. Use these to prepare for the kind of thinking expected on a quiz or exam—not to predict exact test questions.</p>';
 html+='<div class="notice tiny"><b>Question sources</b><div style="margin-top:6px"><label><input type="checkbox" checked disabled> Chapter 16: Institutions</label></div><div class="muted">Earlier chapters can be included once their reviewed banks are connected. This pilot loads Chapter 16 only.</div></div>';

 if(mc){
 html+='<div class="choicewrap">'+q.choices.map((option,i)=>'<button class="choice '+(answered===i?'chosen':'')+'" data-exam-choice="'+i+'" '+(answered!==undefined?'disabled':'')+'>'+esc(option)+'</button>').join("")+'</div>';

 if(E.reveals[key])html+='<div class="feedback"><b>Self-review criteria</b><ul>'+q.rubric.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><p>'+esc(q.feedback)+'</p><p class="tiny muted">Your written answer is not automatically graded. These criteria help identify strengths and gaps, not certify mastery.</p></div>';
 }
 html+='<div class="actions"><button id="exam-prev" '+(n===0?'disabled':'')+'>Previous</button><button class="primary" id="exam-next" '+(n===count-1?'disabled':'')+'>Next question</button><button id="exam-reset">Start this session over</button></div>';
 html+='<p class="tiny muted">Need foundations? <a href="#precise-checkpoint-1" id="exam-foundations">Review this chapter’s concept checkpoints</a>. This session stores drafts only in this browser; no test grade or mastery status is issued.</p>';
 document.querySelector("#work").innerHTML=html;
 document.querySelector("#exam-count").onchange=e=>{E.count=Number(e.target.value);E.index=0;save();chapter()};

 const writing=document.querySelector("#exam-writing");if(writing)writing.oninput=e=>{E.answers[key]=e.target.value;save()};
